[workspace]
resolver = "3"
edition = 2024
members = ["fudge-irs", "fudge-driver", "fudge-parser", "fudge-codegen", "fudge-macros", "fudge-common", "qbe-rs", "fudge-clargs"]
exclude = ["fuzz"]

[workspace.lints.rust]
dead_code = "allow"
unsafe_code = "forbid"
unused_imports = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }


[profile.optmax]
inherits = "release"
opt-level = 3
lto = "fat"
target-cpu = "native"
march = "native"
